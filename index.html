    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'clinic-pink': '#FFC0CB', // Soft pink for accents
                        'clinic-light-pink': '#FCE7F3', // Very light pink for table headers

        // --- English QWERTY (Dubeolsik) -> Hangul converter ---
// Maps key presses like "zlqhem" to "킹덤" (example depends on input)
function enToHangulDubeolsik(input) {
  // 2-beolsik key -> jamo mapping (lowercase only; we'll lowercase input)
  const map = {
    r: "ㄱ", s: "ㄴ", e: "ㄷ", f: "ㄹ", a: "ㅁ", q: "ㅂ", t: "ㅅ", d: "ㅇ", w: "ㅈ", c: "ㅊ",
    z: "ㅋ", x: "ㅌ", v: "ㅍ", g: "ㅎ",
    k: "ㅏ", o: "ㅐ", i: "ㅑ", j: "ㅓ", p: "ㅔ", u: "ㅕ", h: "ㅗ", y: "ㅛ",
    n: "ㅜ", b: "ㅠ", m: "ㅡ", l: "ㅣ",
  };

  // Double consonants / compound vowels composition while typing
  const doubleInitial = { "ㄱㄱ": "ㄲ", "ㄷㄷ": "ㄸ", "ㅂㅂ": "ㅃ", "ㅅㅅ": "ㅆ", "ㅈㅈ": "ㅉ" };
  const compoundVowel = {
    "ㅗㅏ": "ㅘ", "ㅗㅐ": "ㅙ", "ㅗㅣ": "ㅚ",
    "ㅜㅓ": "ㅝ", "ㅜㅔ": "ㅞ", "ㅜㅣ": "ㅟ",
    "ㅡㅣ": "ㅢ",
  };
  const compoundFinal = {
    "ㄱㅅ": "ㄳ", "ㄴㅈ": "ㄵ", "ㄴㅎ": "ㄶ", "ㄹㄱ": "ㄺ", "ㄹㅁ": "ㄻ", "ㄹㅂ": "ㄼ",
    "ㄹㅅ": "ㄽ", "ㄹㅌ": "ㄾ", "ㄹㅍ": "ㄿ", "ㄹㅎ": "ㅀ", "ㅂㅅ": "ㅄ",
  };

  const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
  const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

  const isConsonant = (j) => "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".includes(j);
  const isVowel = (j) => "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".includes(j);

  // State: current syllable pieces
  let L = ""; // initial consonant
  let V = ""; // vowel
  let T = ""; // final consonant
  let out = "";

  function flush() {
    if (!L && !V && !T) return;
    // If only consonant or vowel, output as is
    if (!V) {
      out += L || T;
    } else if (!L) {
      out += V;
    } else {
      const li = CHO.indexOf(L);
      const vi = JUNG.indexOf(V);
      const ti = JONG.indexOf(T);
      if (li >= 0 && vi >= 0 && ti >= 0) {
        const code = 0xAC00 + (li * 21 + vi) * 28 + ti;
        out += String.fromCharCode(code);
      } else {
        out += (L + V + T);
      }
    }
    L = V = T = "";
  }

  const s = String(input || "").toLowerCase();
  for (let idx = 0; idx < s.length; idx++) {
    const ch = s[idx];
    const jamo = map[ch];

    // Not a mapped key: flush and keep char
    if (!jamo) {
      flush();
      out += ch;
      continue;
    }

    // Consonant input
    if (isConsonant(jamo)) {
      if (!V) {
        // building initial
        if (!L) {
          L = jamo;
        } else {
          const dbl = doubleInitial[L + jamo];
          if (dbl) L = dbl;
          else { flush(); L = jamo; }
        }
      } else {
        // vowel exists -> this is final consonant
        if (!T) {
          T = jamo;
        } else {
          const cmb = compoundFinal[T + jamo];
          if (cmb) T = cmb;
          else { flush(); L = jamo; }
        }
      }
      continue;
    }

    // Vowel input
    if (isVowel(jamo)) {
      if (!V) {
        // if we had only final/initial consonant, treat as initial
        if (!L && T) { L = T; T = ""; }
        V = jamo;
      } else if (!T) {
        // try compound vowel
        const cmb = compoundVowel[V + jamo];
        if (cmb) V = cmb;
        else { flush(); V = jamo; }
      } else {
        // We have a final consonant, but a vowel comes: split final to next syllable initial
        // If compound final, split
        const splitMap = {
          "ㄳ": ["ㄱ","ㅅ"], "ㄵ": ["ㄴ","ㅈ"], "ㄶ": ["ㄴ","ㅎ"], "ㄺ": ["ㄹ","ㄱ"], "ㄻ": ["ㄹ","ㅁ"],
          "ㄼ": ["ㄹ","ㅂ"], "ㄽ": ["ㄹ","ㅅ"], "ㄾ": ["ㄹ","ㅌ"], "ㄿ": ["ㄹ","ㅍ"], "ㅀ": ["ㄹ","ㅎ"],
          "ㅄ": ["ㅂ","ㅅ"],
        };
        const parts = splitMap[T];
        if (parts) {
          // Keep first part as final of current, move second to next initial
          const first = parts[0], second = parts[1];
          T = first;
          flush();
          L = second;
          V = jamo;
        } else {
          // Move T to next initial
          const nextL = T;
          T = "";
          flush();
          L = nextL;
          V = jamo;
        }
      }
      continue;
    }
  }

  flush();
  return out;
}

    <script>
  // ✅ (1) 구글시트 CSV 주소를 여기에 붙여넣기 (products 시트)

  // ✅ (2) 예전 하드코딩 배열 대신, 시트에서 불러와 채울 변수
  let allProceduresData = [];

  // ✅ (3) CSV 파서
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const next = text[i + 1];

      if (ch === '"' && inQuotes && next === '"') {
        cur += '"';
        i++;
        continue;
      }
      if (ch === '"') {
        inQuotes = !inQuotes;
        continue;
      }
      if (ch === "," && !inQuotes) {
        row.push(cur);
        cur = "";
        continue;
      }
      if ((ch === "\n" || ch === "\r") && !inQuotes) {
        if (ch === "\r" && next === "\n") i++;
        row.push(cur);
        cur = "";
        if (row.some(cell => String(cell).trim() !== "")) rows.push(row);
        row = [];
        continue;
      }
      cur += ch;
    }

    row.push(cur);
    if (row.some(cell => String(cell).trim() !== "")) rows.push(row);

    return rows;
  }

  // ✅ (4) 구글시트(products 시트)에서 데이터 불러오기
  async function loadProceduresFromSheet() {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("여기에_")) {
      console.warn("SHEET_CSV_URL이 설정되지 않았습니다.");
      return;
    }

    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("시트 데이터를 불러오지 못했습니다.");

    const csvText = await res.text();
    const table = parseCSV(csvText);
    if (table.length < 2) throw new Error("CSV 데이터가 비어있습니다.");

    const headers = table[0].map(h => String(h).trim());
    const idx = {
      id: headers.indexOf("id"),
      name: headers.indexOf("name"),
      price: headers.indexOf("price"),
      category: headers.indexOf("category"),
      active: headers.indexOf("active"),
      memo: headers.indexOf("memo"),
        // ✅ 번역 컬럼 인덱스 추가
  name_en: headers.indexOf("name_en"),
  name_jp: headers.indexOf("name_jp"),
  name_cn: headers.indexOf("name_cn"),
    };

    // 필수 컬럼 체크
    if (idx.id < 0 || idx.name < 0 || idx.price < 0 || idx.category < 0) {
      throw new Error("시트 헤더가 id, name, price, category 를 포함해야 합니다.");
    }

    const items = [];
    for (let r = 1; r < table.length; r++) {
      const line = table[r];

      const id = String(line[idx.id] ?? "").trim();
      const name = String(line[idx.name] ?? "").trim();
      const name_en = idx.name_en >= 0 ? String(line[idx.name_en] ?? "").trim() : "";
      const name_jp = idx.name_jp >= 0 ? String(line[idx.name_jp] ?? "").trim() : "";
      const name_cn = idx.name_cn >= 0 ? String(line[idx.name_cn] ?? "").trim() : "";
      const category = String(line[idx.category] ?? "").trim();
      const priceRaw = String(line[idx.price] ?? "").replace(/[^\d]/g, "");
      const price = Number(priceRaw);
      const memo = idx.memo >= 0 ? String(line[idx.memo] ?? "").trim() : "";

       

      // active: TRUE/true/1/y/yes 정도만 활성로 인정 (없으면 기본 true)
      let isActive = true;
      if (idx.active >= 0) {
        const a = String(line[idx.active] ?? "").trim().toLowerCase();
        isActive = ["true", "1", "y", "yes"].includes(a);
      }

      if (!id || !name || !category) continue;
      if (!Number.isFinite(price)) continue;
      if (!isActive) continue; // ✅ active가 꺼져있으면 제외

      items.push({ id, name, price, category, memo, name_en, name_jp, name_cn, });
    }

    allProceduresData = items;
    console.log("✅ 시트 데이터 로딩 완료:", allProceduresData.length);
  }

}

  });
function getTranslatedName(item) {

    case "EN":

    case "CN":
      return item.name_cn || item.name;
    default:
      return item.name;   // 기본 한국어
  }
}

// === 시술 카테고리 우선순위 정렬 함수 시작 ===

// 카테고리별 우선순위
// 1. 피부관리 > 2. 이벤트시술 > 3. 리프팅 > 4. 올인원테라피
// 5. 레이저 > 6. 트러블 > 7. 체형관리
// 8. 주사류(부스터/보톡스/필러/면역주사) > 9. 제모 > 그 외
function getCategoryPriority(rawCategory) {
  const cat = String(rawCategory || '').trim().toLowerCase();

  // 1순위: 피부관리
  if (cat === 'skincare') return 1;

  // 2순위: 이벤트시술 (이벤트, 프라임 등)
  if (cat === 'event' || cat === 'prime') return 2;

  // 3순위: 리프팅
  if (cat === 'lifting') return 3;

  // 4순위: 올인원테라피
  if (cat === 'allinone') return 4;

  // 5순위: 레이저
  if (cat === 'laser') return 5;

  // 6순위: 트러블
  if (cat === 'trouble') return 6;

  // 7순위: 체형관리
  if (cat === 'body') return 7;

  // 8순위: 주사류 (부스터, 보톡스, 필러, 면역주사)
  if (['booster', 'botox', 'filler', 'injection'].includes(cat)) return 8;

  // 9순위: 제모 (여성제모 / 남성제모)
  if (cat === 'femalehair' || cat === 'malehair') return 9;

  // 그 외
  return 99;
}
// 실제 정렬에 쓰는 함수
function sortForChart(a, b) {
  const pa = getCategoryPriority(a && a.category);
  const pb = getCategoryPriority(b && b.category);

  // 카테고리 우선순위가 다르면 그 순서대로
  if (pa !== pb) {
    return pa - pb;
  }

  // 같은 카테고리면 기존처럼 id 순
  return String(a.id || '').localeCompare(String(b.id || ''));
}

// ✅ 버튼 옆에 팝업 위치시키기
function positionMembershipPopup() {
  const btn = document.getElementById('btn-membership-plus');
  const popup = document.getElementById('membership-popup');
  if (!btn || !popup) return;

  const r = btn.getBoundingClientRect();
  const gap = 8;

  // 기본: 버튼 오른쪽에 붙이기
  let left = r.right + gap;
  let top = r.top - 6;

  // 화면 밖으로 나가면 왼쪽으로
  const popupW = 260;
  if (left + popupW > window.innerWidth - 8) {
    left = r.left - popupW - gap;
  }

  // 위/아래 보정
  const popupH = 220; // 대충(옵션 늘리면 자동으로 커짐)
  if (top + popupH > window.innerHeight - 8) {
    top = window.innerHeight - popupH - 8;
  }
  if (top < 8) top = 8;

  popup.style.left = `${Math.max(8, left)}px`;
  popup.style.top = `${top}px`;
}

function openMembershipPopup() {
  ensureMembershipPopup();
  renderMembershipPopupList();

  const popup = document.getElementById('membership-popup');

}

function closeMembershipPopup() {

}

// ✅ 차트 버튼: "차트만" 텍스트 추출 + 자동 복사
function exportChartOnly() {
  try {
    // cart 전역이 이미 있음 (너 코드에 있음)
    const items = Object.values(cart || {})
      .filter(it => it && it.checked)                 // ✅ 체크된 항목만
      .sort(sortForChart);

    if (items.length === 0) {
      alert('선택된 시술이 없습니다.');
      return;
    }

    let total = 0;

    const lines = items.map(item => {
      const rawName = String(item.name || '').trim();
      const price = Number(item.totalTaxIncludedPrice || 0);
      total += price;

      // 1) "n회" -> "n-1"
      let name = rawName.replace(/(\d+)\s*회/g, (_, n) => `${n}-1`);

      // 2) 횟수( n회 )가 아예 없던 시술이면 끝에 " 1-1" 붙이기
      //    (이미 변환된 "n-1"이 있으면 패스)
      if (!/(\d+)-1/.test(name)) {
  const qty = Number(item.quantity) || 1;
  name = `${name} ${qty}-1`;
}

      // 3) + 기호 주변 공백 정리 (예: " 20-1 + 셀바이브 2-1" -> "20-1+셀바이브 2-1")
      name = name.replace(/\s*\+\s*/g, '+');

      // 4) "셀바이브2-1" 같이 붙는 케이스를 "셀바이브 2-1"로
      name = name.replace(/([가-힣A-Za-z])(\d+-1)/g, '$1 $2');

      // 결과 라인: "이름  금액원"
      return `${name} ${price.toLocaleString('ko-KR')}원`;
    });

    lines.push(`총 ${total.toLocaleString('ko-KR')}원`);

    const textToCopy = lines.join('\n');

    // ✅ 클립보드 복사 (가능하면 navigator, 안되면 fallback)
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy)
        .catch(() => fallbackCopyText(textToCopy));
    } else {
      fallbackCopyText(textToCopy);
    }
  } catch (e) {
    alert('차트 생성 중 오류가 발생했습니다.');
    console.error(e);
  }
}

// ✅ 구형 브라우저용 복사 fallback
function fallbackCopyText(text) {
  const temp = document.createElement('textarea');
  temp.value = text;
  temp.style.position = 'fixed';
  temp.style.left = '-9999px';
  temp.style.top = '-9999px';
  document.body.appendChild(temp);
  temp.focus();
  temp.select();

  try {
    document.execCommand('copy');
    //alert('차트가 복사되었습니다.');
  } catch (e) {
    alert('복사 실패 — 수동 복사가 필요합니다.');
    console.error(e);
  }

  document.body.removeChild(temp);
}

// ✅ 오늘 날짜 YY.MM.DD
function getTodayYYMMDD() {
  const d = new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yy}.${mm}.${dd}`;
}

(() => {
  const track = document.getElementById("all-slider-track");
  const prev = document.getElementById("all-prev");
  const next = document.getElementById("all-next");
  const allBtn = document.getElementById("all-btn");

  if (!track || !prev || !next || !allBtn) return;

  const slides = track.children;
  const total = slides.length;
  let index = 0;

  function update() {
    track.style.transform = `translateX(${-index * 100}%)`;
  }

  prev.addEventListener("click", (e) => {
    e.stopPropagation();
    index = (index - 1 + total) % total;
    update();
  });

  next.addEventListener("click", (e) => {
    e.stopPropagation();
    index = (index + 1) % total;
    update();
  });

  // ALL 버튼 다시 누르면 항상 첫 장부터
  allBtn.addEventListener("click", () => {
    index = 0;
    update();
  });
})();

function parseKrwNumber(text) {
  if (text == null) return 0;
  return Number(String(text).replace(/[^\d]/g, "")) || 0;
}

function formatKrw(n) {
  return Math.round(n).toLocaleString("ko-KR") + "원";
}

function toggleDiscountText() {
  const box = document.getElementById('discount-text');
  const finalEl = document.getElementById('final-total');
  if (!box || !finalEl) return;

  // 이미 열려 있으면 닫기
  if (!box.classList.contains('hidden')) {
    box.classList.add('hidden');
    return;
  }

  const base = parseKrwNumber(finalEl.textContent);

  const line1 = `→ 2인동반 5%  ${formatKrw(base * 0.95)}`;
  const line2 = `→ 3인동반 10%  ${formatKrw(base * 0.90)}`;
  const line3 = `→ 지인할인 5%  ${formatKrw(base * 0.95)}`;

  box.textContent = [line1, line2, line3].join("\n");
  box.classList.remove('hidden');
}
