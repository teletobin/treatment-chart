    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'clinic-pink': '#FFC0CB', // Soft pink for accents
                        'clinic-light-pink': '#FCE7F3', // Very light pink for table headers
                        'clinic-border': '#FBCFE8', // Pink-300 equivalent
                    }
                }
            }
        }
        // --- English QWERTY (Dubeolsik) -> Hangul converter ---
        function enToHangulDubeolsik(input) {
            const map = {
                r: "ㄱ", s: "ㄴ", e: "ㄷ", f: "ㄹ", a: "ㅁ", q: "ㅂ", t: "ㅅ", d: "ㅇ", w: "ㅈ", c: "ㅊ",
                z: "ㅋ", x: "ㅌ", v: "ㅍ", g: "ㅎ",
                k: "ㅏ", o: "ㅐ", i: "ㅑ", j: "ㅓ", p: "ㅔ", u: "ㅕ", h: "ㅗ", y: "ㅛ",
                n: "ㅜ", b: "ㅠ", m: "ㅡ", l: "ㅣ",
            };

            const doubleInitial = { "ㄱㄱ": "ㄲ", "ㄷㄷ": "ㄸ", "ㅂㅂ": "ㅃ", "ㅅㅅ": "ㅆ", "ㅈㅈ": "ㅉ" };
            const compoundVowel = {
                "ㅗㅏ": "ㅘ", "ㅗㅐ": "ㅙ", "ㅗㅣ": "ㅚ",
                "ㅜㅓ": "ㅝ", "ㅜㅔ": "ㅞ", "ㅜㅣ": "ㅟ",
                "ㅡㅣ": "ㅢ",
            };
            const compoundFinal = {
                "ㄱㅅ": "ㄳ", "ㄴㅈ": "ㄵ", "ㄴㅎ": "ㄶ", "ㄹㄱ": "ㄺ", "ㄹㅁ": "ㄻ", "ㄹㅂ": "ㄼ",
                "ㄹㅅ": "ㄽ", "ㄹㅌ": "ㄾ", "ㄹㅍ": "ㄿ", "ㄹㅎ": "ㅀ", "ㅂㅅ": "ㅄ",
            };

            const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","요","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
            const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

            const isConsonant = (j) => "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".includes(j);
            const isVowel = (j) => "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚ요ㅜㅝㅞㅟㅠㅡㅢㅣ".includes(j);

            let L = ""; 
            let V = ""; 
            let T = ""; 
            let out = "";

            function flush() {
                if (!L && !V && !T) return;
                if (!V) {
                    out += L || T;
                } else if (!L) {
                    out += V;
                } else {
                    const li = CHO.indexOf(L);
                    const vi = JUNG.indexOf(V);
                    const ti = JONG.indexOf(T);
                    if (li >= 0 && vi >= 0 && ti >= 0) {
                        const code = 0xAC00 + (li * 21 + vi) * 28 + ti;
                        out += String.fromCharCode(code);
                    } else {
                        out += (L + V + T);
                    }
                }
                L = V = T = "";
            }

            const s = String(input || "").toLowerCase();
            for (let idx = 0; idx < s.length; idx++) {
                const ch = s[idx];
                const jamo = map[ch];

                if (!jamo) {
                    flush();
                    out += ch;
                    continue;
                }

                if (isConsonant(jamo)) {
                    if (!V) {
                        if (!L) {
                            L = jamo;
                        } else {
                            const dbl = doubleInitial[L + jamo];
                            if (dbl) L = dbl;
                            else { flush(); L = jamo; }
                        }
                    } else {
                        if (!T) {
                            T = jamo;
                        } else {
                            const cmb = compoundFinal[T + jamo];
                            if (cmb) T = cmb;
                            else { flush(); L = jamo; }
                        }
                    }
                    continue;
                }

                if (isVowel(jamo)) {
                    if (!V) {
                        if (!L && T) { L = T; T = ""; }
                        V = jamo;
                    } else if (!T) {
                        const cmb = compoundVowel[V + jamo];
                        if (cmb) V = cmb;
                        else { flush(); V = jamo; }
                    } else {
                        const splitMap = {
                            "ㄳ": ["ㄱ","ㅅ"], "ㄵ": ["ㄴ","ㅈ"], "ㄶ": ["ㄴ","ㅎ"], "ㄺ": ["ㄹ","ㄱ"], "ㄻ": ["ㄹ","ㅁ"],
                            "ㄼ": ["ㄹ","ㅂ"], "ㄽ": ["ㄹ","ㅅ"], "ㄾ": ["ㄹ","ㅌ"], "ㄿ": ["ㄹ","ㅍ"], "ㅀ": ["ㄹ","ㅎ"],
                            "ㅄ": ["ㅂ","ㅅ"],
                        };
                        const parts = splitMap[T];
                        if (parts) {
                            const first = parts[0], second = parts[1];
                            T = first;
                            flush();
                            L = second;
                            V = jamo;
                        } else {
                            const nextL = T;
                            T = "";
                            flush();
                            L = nextL;
                            V = jamo;
                        }
                    }
                    continue;
                }
            }

            flush();
            return out;
        }
    </script>

<!-- 실시간 환율 화이트 미니멀 캡슐 툴팁 (마우스 오버시 노출) -->
<div id="currency-tooltip" class="fixed hidden z-50 pointer-events-none bg-white border border-[#F68F9D]/30 px-3 py-1.5 rounded-full shadow-md flex items-center gap-2 text-[11px] font-medium text-gray-600 tracking-wide"></div>

<script>
  // ✅ (1) 구글시트 CSV 주소를 여기에 붙여넣기 (products 시트)
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSR5YlHFBGiaLIDVxyYiaE0lQxjrolOyu0Tbf9hKzBPxEaCsKoXBjylECHvENyyzVLN2yCJkGpUwbBk/pub?gid=3054119&single=true&output=csv";

  // ✅ (2) 예전 하드코딩 배열 대신, 시트에서 불러와 채울 변수
  let allProceduresData = [];

  // ✅ (3) CSV 파서
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const next = text[i + 1];

      if (ch === '"' && inQuotes && next === '"') {
        cur += '"';
        i++;
        continue;
      }
      if (ch === '"') {
        inQuotes = !inQuotes;
        continue;
      }
      if (ch === "," && !inQuotes) {
        row.push(cur);
        cur = "";
        continue;
      }
      if ((ch === "\n" || ch === "\r") && !inQuotes) {
        if (ch === "\r" && next === "\n") i++;
        row.push(cur);
        cur = "";
        if (row.some(cell => String(cell).trim() !== "")) rows.push(row);
        row = [];
        continue;
      }
      cur += ch;
    }

    row.push(cur);
    if (row.some(cell => String(cell).trim() !== "")) rows.push(row);

    return rows;
  }

  // ✅ (4) 구글시트(products 시트)에서 데이터 불러오기
  async function loadProceduresFromSheet() {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("여기에_")) {
      console.warn("SHEET_CSV_URL이 설정되지 않았습니다.");
      return;
    }

    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("시트 데이터를 불러오지 못했습니다.");

    const csvText = await res.text();
    const table = parseCSV(csvText);
    if (table.length < 2) throw new Error("CSV 데이터가 비어있습니다.");

    const headers = table[0].map(h => String(h).trim());
    const idx = {
      id: headers.indexOf("id"),
      name: headers.indexOf("name"),
      price: headers.indexOf("price"),
      category: headers.indexOf("category"),
      active: headers.indexOf("active"),
      memo: headers.indexOf("memo"),
      name_en: headers.indexOf("name_en"),
      name_jp: headers.indexOf("name_jp"),
      name_cn: headers.indexOf("name_cn"),
    };

    if (idx.id < 0 || idx.name < 0 || idx.price < 0 || idx.category < 0) {
      throw new Error("시트 헤더가 id, name, price, category 를 포함해야 합니다.");
    }

    const items = [];
    for (let r = 1; r < table.length; r++) {
      const line = table[r];

      const id = String(line[idx.id] ?? "").trim();
      const name = String(line[idx.name] ?? "").trim();
      const name_en = idx.name_en >= 0 ? String(line[idx.name_en] ?? "").trim() : "";
      const name_jp = idx.name_jp >= 0 ? String(line[idx.name_jp] ?? "").trim() : "";
      const name_cn = idx.name_cn >= 0 ? String(line[idx.name_cn] ?? "").trim() : "";
      const category = String(line[idx.category] ?? "").trim();
      const priceRaw = String(line[idx.price] ?? "").replace(/[^\d]/g, "");
      const price = Number(priceRaw);
      const memo = idx.memo >= 0 ? String(line[idx.memo] ?? "").trim() : "";

      let isActive = true;
      if (idx.active >= 0) {
        const a = String(line[idx.active] ?? "").trim().toLowerCase();
        isActive = ["true", "1", "y", "yes"].includes(a);
      }

      if (!id || !name || !category) continue;
      if (!Number.isFinite(price)) continue;
      if (!isActive) continue; 

      items.push({ id, name, price, category, memo, name_en, name_jp, name_cn, });
    }

    allProceduresData = items;
    console.log("✅ 시트 데이터 로딩 완료:", allProceduresData.length);
  }

  // ✅ 언어 메뉴 토글 함수
  function toggleLanguageMenu() {
    const menu = document.getElementById('language-menu');
    if (menu) menu.classList.toggle('hidden');
  }

  function selectLanguage(langCode) {
    currentLanguage = langCode;   // 'EN' / 'JP' / 'CN'

    const menu = document.getElementById('language-menu');
    if (menu) menu.classList.add('hidden');

    updateCart();
  }

  document.addEventListener('click', (e) => {
    const menu = document.getElementById('language-menu');
    const btn = document.getElementById('btn-lang-toggle');
    if (!menu || !btn) return;
    
    if (!menu.classList.contains('hidden')) {
      if (!menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
      }
    }
  });

  function getTranslatedName(item) {
    if (!item) return "";

    switch (currentLanguage) {
      case "KR":
        return item.name;      
      case "EN":
        return item.name_en || item.name;
      case "JP":
        return item.name_jp || item.name;
      case "CN":
        return item.name_cn || item.name;
      default:
        return item.name;   
    }
  }

  let cart = {}; 
  let wishlist = {}; 
  let isWishlistView = false; 
  let currentCategory = 'event';
  let currentCategoryName = '한정 이벤트';
  let isSearchVisible = false;
  let isFinalDiscountApplied = false;   // 최종금액 5% 할인 여부
  let currentLanguage = 'KO';  // 기본: 한국어

  // DOM 요소 가져오기
  const procedureList = document.getElementById('procedure-list');
  const procedureListTitle = document.getElementById('procedure-list-title');
  const cartList = document.getElementById('cart-list');
  const finalTotalDisplay = document.getElementById('final-total');
  const emptyCartMessage = document.getElementById('empty-cart-message');
  const wishlistToggleButton = document.getElementById('wishlist-toggle-btn');
  const finalTotalContainer = document.getElementById('final-total-container');

  // 최종금액 박스 우클릭 → 5% 할인 토글
  finalTotalContainer.addEventListener('contextmenu', e => {
    e.preventDefault();  
    isFinalDiscountApplied = !isFinalDiscountApplied; 
    updateCart(); 
  });

  const menuTabs = document.querySelectorAll('.menu-tab');
  const searchContainer = document.getElementById('search-container');
  const searchInput = document.getElementById('search-input');
  const searchResultsDropdown = document.getElementById('search-results-dropdown');

  // 검색 드롭다운 키보드 탐색 상태
  let searchActiveIndex = -1;      // -1 = 하이라이트 없음
  let searchVisibleIds = [];       // 현재 드롭다운에 렌더된 시술 id 순서

  const calculateTotalTaxIncludedPrice = (price, quantity) => Math.floor(price * quantity * 1.1);

  // 우측 시술목록 합계 칸 우클릭 시 -5% 할인 토글
  cartList.addEventListener('contextmenu', function (e) {
    const amountCell = e.target.closest('.cart-item-amount');
    if (!amountCell) return;

    e.preventDefault();

    const id = amountCell.dataset.id;
    const item = cart[id];
    if (!item) return;

    if (!item.discount5Applied) {
      item.discount5Applied = true;
      item.originalTotalForDiscount = item.totalTaxIncludedPrice;
      item.totalTaxIncludedPrice = Math.floor(item.totalTaxIncludedPrice * 0.95);
    } else {
      item.totalTaxIncludedPrice = item.originalTotalForDiscount;
      delete item.originalTotalForDiscount;
      item.discount5Applied = false;
    }

    updateCart();
  });

  function setCategoryFilter(category, categoryName) {
      if (isWishlistView) {
          isWishlistView = false;
          updateWishlistToggleButtonUI(); 
      }
      
      currentCategory = category;
      currentCategoryName = categoryName;

      menuTabs.forEach(tab => {
          tab.classList.remove('active-menu');
          tab.classList.add('bg-white', 'text-gray-700');
      });
      const activeTab = document.getElementById(`menu-${category}`);
      if (activeTab) {
          activeTab.classList.add('active-menu');
          activeTab.classList.remove('text-gray-700', 'bg-white', 'hover:bg-[#F7E4E8]');
      }

      procedureListTitle.textContent = categoryName;
      renderProcedureList();
  }
  window.setCategoryFilter = setCategoryFilter;

  function updateWishlistToggleButtonUI() {
      if (isWishlistView) {
          wishlistToggleButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#F198AE" stroke="#F198AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
      } else {
          wishlistToggleButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
      }
  }

  function renderProcedureList() {
      let filteredProcedures = allProceduresData.filter(proc => {
          const categoryMatch = proc.category === currentCategory;
          const wishlistMatch = !!wishlist[proc.id];
          if (isWishlistView) return wishlistMatch;
          return categoryMatch;
      });

      if (isWishlistView && Object.keys(wishlist).length === 0) {
          procedureList.innerHTML = `<p class="text-center text-gray-500 py-2 col-span-12">관심 시술 목록이 비어 있습니다.</p>`;
          return;
      }
      if (!isWishlistView && filteredProcedures.length === 0) {
          procedureList.innerHTML = `<p class="text-center text-gray-500 py-2 col-span-12">선택된 카테고리에 시술 항목이 없습니다.</p>`;
          return;
      }

      procedureList.innerHTML = filteredProcedures.map(proc => {
          const currentQuantity = cart[proc.id] ? cart[proc.id].quantity : 1;
          const totalTaxIncludedPrice = calculateTotalTaxIncludedPrice(proc.price, currentQuantity);
          
          const isFavorited = !!wishlist[proc.id];
          const isChecked = !!cart[proc.id];

          const heartIconSvg = isFavorited
              ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#F198AE" stroke="#F198AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`
              : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart text-[#F68F9D]/70 hover:text-[#F68F9D]"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;

          const renderVisualCheckbox = (id, checked) => `
              <label for="check-${id}" class="cursor-pointer">
                  <input type="checkbox" id="check-${id}" class="form-checkbox h-4 w-4 text-[#F68F9D] rounded focus:ring-[#F68F9D] cursor-pointer hidden" onchange="handleCartCheckboxChange('${id}')" ${checked ? 'checked' : ''}>
                  <div class="w-3 h-3 border border-[#F68F9D] rounded transition duration-150 ease-in-out flex items-center justify-center ${checked ? 'bg-[#F68F9D] border-[#F68F9D]' : 'bg-white'}">
                      ${checked ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 13.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>' : ''}
                  </div>
              </label>
          `;

          return `
              <div class="procedure-item grid grid-cols-12 items-center text-xs text-gray-800 py-2 border-b border-pink-50/50 hover:bg-[#F7E4E8] transition" data-id="${proc.id}">
                  <div class="col-span-1 flex justify-center items-center space-x-1">
                      <button onclick="toggleWishlist('${proc.id}')" class="wishlist-icon focus:outline-none" id="heart-${proc.id}" aria-label="Add to wishlist">
                          ${heartIconSvg}
                      </button>
                      ${renderVisualCheckbox(proc.id, isChecked)}
                  </div>
                  <label for="check-${proc.id}" class="col-span-7 cursor-pointer text-left pl-2 pr-1" title="${proc.memo || ''}">
                    ${proc.name}
                  </label>
                  <div class="col-span-2 text-right text-gray-600">${formatPrice(proc.price)}</div>
                  <div class="col-span-1 flex justify-center">
                      <div class="quantity-control flex-row !ml-0">
                          <input type="number" id="quantity-${proc.id}" value="${Number(currentQuantity) || 1}" min="1" max="9" readonly="readonly">
                          <div class="up-down-container">
                              <button onclick="changeQuantity('${proc.id}', 1)" aria-label="Increase quantity">
                                  <svg xmlns="http://www.w3.org/2000/svg" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucude-chevron-up"><path d="m18 15-6-6-6 6"/></svg>
                              </button>
                              <button onclick="changeQuantity('${proc.id}', -1)" aria-label="Decrease quantity">
                                  <svg xmlns="http://www.w3.org/2000/svg" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                              </button>
                          </div>
                      </div>
                  </div>
                  <div class="col-span-1 text-right text-gray-700 pr-3" id="total-${proc.id}">${formatPrice(totalTaxIncludedPrice)}</div>
              </div>
          `;
      }).join('');
  }

  function changeQuantity(procedureId, delta) {
      const inputElement = document.getElementById(`quantity-${procedureId}`);
      if (!inputElement) return;
      let currentQuantity = parseInt(inputElement.value, 10);
      let newQuantity = currentQuantity + delta;
      if (newQuantity < 1) newQuantity = 1;
      if (newQuantity > 99) newQuantity = 99; 
      updateQuantity(procedureId, newQuantity);
  }

  function updateQuantity(procedureId, newQuantity) {
      let quantity = parseInt(newQuantity, 10);
      if (isNaN(quantity) || quantity < 1) quantity = 1;
      else if (quantity > 99) quantity = 99;

      const inputElement = document.getElementById(`quantity-${procedureId}`);
      if (inputElement) inputElement.value = quantity;

      const proc = allProceduresData.find(p => p.id === procedureId);
      if (!proc) return;

      const newTotalTaxIncluded = calculateTotalTaxIncludedPrice(proc.price, quantity);

      const totalDisplayElement = document.getElementById(`total-${proc.id}`);
      if (totalDisplayElement) totalDisplayElement.textContent = formatPrice(newTotalTaxIncluded);

      if (cart[procedureId]) {
          cart[procedureId].quantity = quantity;
          cart[procedureId].totalTaxIncludedPrice = newTotalTaxIncluded;
          updateCart();
      }
  }

  function handleCartCheckboxChange(procedureId) {
      const checkbox = document.getElementById(`check-${procedureId}`);
      if (!checkbox) return;

      const isChecked = checkbox.checked;
      const proc = allProceduresData.find(p => p.id === procedureId);
      if (!proc) return;

      const quantityInput = document.getElementById(`quantity-${procedureId}`);
      const currentQuantity = quantityInput ? parseInt(quantityInput.value, 10) : 1;

      if (isChecked) {
          cart[procedureId] = {
              id: proc.id,
              name: proc.name,
              price: proc.price,
              category: proc.category,
              name_en: proc.name_en,
              name_jp: proc.name_jp,
              name_cn: proc.name_cn,
              quantity: currentQuantity,
              totalTaxIncludedPrice: calculateTotalTaxIncludedPrice(proc.price, currentQuantity),
              checked: true
          };
      } else {
          delete cart[procedureId];
      }

      const visualCheckbox = checkbox.nextElementSibling;
      if (visualCheckbox) {
          if (isChecked) {
              visualCheckbox.classList.add('bg-[#F68F9D]', 'border-[#F68F9D]');
              visualCheckbox.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 13.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>';
          } else {
              visualCheckbox.classList.remove('bg-[#F68F9D]', 'border-[#F68F9D]');
              visualCheckbox.innerHTML = '';
          }
      }

      updateCart();
  }

  function handleCartItemCheckChange(procedureId) {
      const checkbox = document.getElementById(`cart-check-${procedureId}`);
      if (!checkbox) return;

      const isChecked = checkbox.checked;
      if (cart[procedureId]) cart[procedureId].checked = isChecked;

      const visualCheckbox = checkbox.nextElementSibling;
      if (visualCheckbox) {
          if (isChecked) {
              visualCheckbox.classList.add('bg-[#F68F9D]', 'border-[#F68F9D]');
              visualCheckbox.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 13.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>';
          } else {
              visualCheckbox.classList.remove('bg-[#F68F9D]', 'border-[#F68F9D]');
              visualCheckbox.innerHTML = '';
          }
      }

      updateCart();
  }

  function getCategoryPriority(rawCategory) {
    const cat = String(rawCategory || '').trim().toLowerCase();

    if (cat === 'skincare') return 1;
    if (cat === 'event' || cat === 'prime') return 2;
    if (cat === 'lifting') return 3;
    if (cat === 'allinone') return 4;
    if (cat === 'laser') return 5;
    if (cat === 'trouble') return 6;
    if (cat === 'body') return 7;
    if (['booster', 'botox', 'filler', 'injection'].includes(cat)) return 8;
    if (cat === 'femalehair' || cat === 'malehair') return 9;
    return 99;
  }

  function sortForChart(a, b) {
    const pa = getCategoryPriority(a && a.category);
    const pb = getCategoryPriority(b && b.category);

    if (pa !== pb) {
      return pa - pb;
    }
    return String(a.id || '').localeCompare(String(b.id || ''));
  }

  function updateCart() {
      let totalAmount = 0;
      const selectedItems = Object.values(cart).sort(sortForChart);

      if (selectedItems.length === 0) {
          cartList.innerHTML = '';
          emptyCartMessage.classList.remove('hidden');
          finalTotalContainer.classList.add('hidden');
      } else {
          emptyCartMessage.classList.add('hidden');
          finalTotalContainer.classList.remove('hidden');

          cartList.innerHTML = selectedItems.map(item => {
              if (item.checked) totalAmount += item.totalTaxIncludedPrice;

              const renderVisualCartCheckbox = (id, checked) => `
                  <label for="cart-check-${id}" class="cursor-pointer flex justify-center items-center h-full">
                      <input type="checkbox" id="cart-check-${id}"
                          class="form-checkbox h-4 w-4 text-[#F68F9D] rounded focus:ring-[#F68F9D] cursor-pointer hidden"
                          onchange="handleCartItemCheckChange('${id}')" ${checked ? 'checked' : ''}>
                      <div class="w-3 h-3 border border-[#F68F9D] rounded transition duration-150 ease-in-out flex items-center justify-center ${checked ? 'bg-[#F68F9D] border-[#F68F9D]' : 'bg-white'}">
                          ${checked ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 13.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>' : ''}
                      </div>
                  </label>
              `;

              const styleClass = item.checked ? 'text-gray-800' : 'text-gray-400';

             // 우측 박스 장바구니 요소들에 마우스 호버(환율 변환) 이벤트 연결
             return `
                <div class="grid grid-cols-12 items-center text-xs py-2 border-b border-gray-100 hover:bg-pink-50/20 transition-colors"
                     onmouseenter="showCurrencyTooltip(event, ${item.totalTaxIncludedPrice})"
                     onmousemove="moveCurrencyTooltip(event)"
                     onmouseleave="hideCurrencyTooltip()">
                  <!-- 1. 체크박스 + 삭제버튼 -->
                  <div class="col-span-1 flex justify-center items-center gap-1">
                    ${renderVisualCartCheckbox(item.id, item.checked)}

                    <button
                      onclick="removeCartItem('${item.id}')"
                      class="w-3 h-3 rounded-full border border-[#F68F9D] text-[#F68F9D] text-xs font-bold flex items-center justify-center hover:bg-pink-100 transition"
                      title="삭제"
                    >
                      −
                    </button>
                  </div>

                  <!-- 2. 시술명 -->
                  <div class="col-span-8 text-left pl-1 pr-1 cart-item-name ${styleClass}">
                    ${getTranslatedName(item)}
                  </div>

                  <!-- 3. 가격 -->
                  <div class="col-span-1 text-right text-gray-600 ${styleClass}">
                    ${formatPrice(item.price)}
                  </div>

                  <!-- 4. 횟수 -->
                  <div class="col-span-1 text-center ${styleClass}">
                    ${item.quantity}
                  </div>

                  <!-- 5. 합계 (우클릭 할인 대상) -->
                  <div
                    class="col-span-1 text-right text-gray-700 pr-3 ${styleClass} cart-item-amount"
                    data-id="${item.id}"
                  >
                    ${formatPrice(item.totalTaxIncludedPrice)}
                  </div>
                </div>
              `;
          }).join('');
      }

     finalTotalDisplay.textContent = formatPrice(
        isFinalDiscountApplied ? Math.floor(totalAmount * 0.95) : totalAmount
     );
     updateMembershipBalance();
  }

  function toggleWishlist(procedureId) {
      const isFavorited = !!wishlist[procedureId];
      if (isFavorited) delete wishlist[procedureId];
      else wishlist[procedureId] = true;
      renderProcedureList();
  }

  function toggleWishlistView() {
      isWishlistView = !isWishlistView;
      updateWishlistToggleButtonUI();

      if (isWishlistView) {
          procedureListTitle.textContent = '관심시술';
          menuTabs.forEach(tab => tab.classList.remove('active-menu', 'text-white', 'bg-pink-600'));
      } else {
          procedureListTitle.textContent = currentCategoryName;
          const activeTab = document.getElementById(`menu-${currentCategory}`);
          if (activeTab) {
              activeTab.classList.add('active-menu');
              activeTab.classList.remove('text-gray-700', 'bg-white', 'hover:bg-[#F7E4E8]');
          }
      }
      renderProcedureList();
  }

  function toggleSearchInput() {
      isSearchVisible = !isSearchVisible;
      
      if (isSearchVisible) {
          const isMobile = window.innerWidth < 640;
          searchContainer.style.width = isMobile ? '100px' : '160px';
          searchContainer.style.opacity = '1';
          searchInput.focus();
      } else {
          searchContainer.style.width = '0px';
          searchContainer.style.opacity = '0';
          searchInput.value = '';
          searchResultsDropdown.classList.add('hidden');
      }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normalizeSearchText(value) {
    return String(value || "")
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  function getSearchTokens(value) {
    return String(value || "")
      .split(/\s+/)
      .map((token) => token.trim())
      .filter(Boolean)
      .map((token) => enToHangulDubeolsik(token).replace(/\s+/g, "").toLowerCase());
  }

  function handleSearchInput() {
    const queryText = (searchInput.value || "").trim();
    const queryTokens = getSearchTokens(queryText);
    const queryRaw = normalizeSearchText(queryText);
    const queryKo = normalizeSearchText(enToHangulDubeolsik(queryText));

    // 검색어가 바뀌면 하이라이트 초기화
    searchActiveIndex = -1;

    if (queryText.length < 2) {
      searchResultsDropdown.classList.add("hidden");
      searchResultsDropdown.innerHTML = "";
      searchVisibleIds = [];
      return;
    }

    const searchResults = allProceduresData.filter((proc) => {
      const name = normalizeSearchText(proc.name);
      const nameKo = normalizeSearchText(enToHangulDubeolsik(proc.name));
      const normalizedName = nameKo || name;
      const containsAllTokens = queryTokens.every((token) => normalizedName.includes(token));
      const containsWholeQuery = normalizedName.includes(queryRaw) || normalizedName.includes(queryKo);
      return containsAllTokens || containsWholeQuery;
    });

    renderSearchResults(searchResults);
  }

  function renderSearchResults(results) {
    // 다시 그려도 키보드 하이라이트가 같은 항목에 남아 있도록 기억해 둔다
    const previousActiveId =
      searchActiveIndex >= 0 ? searchVisibleIds[searchActiveIndex] : null;

    const queryText = (searchInput?.value || "").trim();
    const queryTokens = getSearchTokens(queryText);
    const queryRaw = normalizeSearchText(queryText);
    const queryKo = normalizeSearchText(enToHangulDubeolsik(queryText));

    if (!results) {
      if (queryText.length < 2) {
        searchResultsDropdown.classList.add("hidden");
        searchResultsDropdown.innerHTML = "";
        searchVisibleIds = [];
        searchActiveIndex = -1;
        return;
      }

      results = allProceduresData.filter((proc) => {
        const name = normalizeSearchText(proc.name);
        const nameKo = normalizeSearchText(enToHangulDubeolsik(proc.name));
        const normalizedName = nameKo || name;
        const containsAllTokens = queryTokens.every((token) => normalizedName.includes(token));
        const containsWholeQuery = normalizedName.includes(queryRaw) || normalizedName.includes(queryKo);
        return containsAllTokens || containsWholeQuery;
      });
    }

    if (!Array.isArray(results) || results.length === 0) {
      searchResultsDropdown.innerHTML = `<div class="p-3 text-xs text-gray-500">검색 결과가 없습니다.</div>`;
      searchResultsDropdown.classList.remove("hidden");
      searchVisibleIds = [];
      searchActiveIndex = -1;
      return;
    }

    const rankedResults = results
      .map((proc) => {
        const name = normalizeSearchText(proc.name);
        const nameKo = normalizeSearchText(enToHangulDubeolsik(proc.name));
        const normalizedName = nameKo || name;
        const matchedTokens = queryTokens.filter((token) => normalizedName.includes(token));
        const containsWholeQuery = normalizedName.includes(queryRaw) || normalizedName.includes(queryKo);
        const score = matchedTokens.length * 100 + (containsWholeQuery ? 50 : 0);
        return { proc, matchedTokens, score };
      })
      .sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return (a.proc.name || "").localeCompare(b.proc.name || "");
      });

    const bestMatch = rankedResults[0];
    const suggestionMarkup = bestMatch
      ? `<div class="px-3 py-2 border-b border-pink-100 bg-[#fff8fa]">
           <div class="text-[10px] font-semibold uppercase tracking-wide text-[#F68F9D]">추천 검색</div>
           <div class="mt-1 text-xs font-medium text-gray-800">${escapeHtml(bestMatch.proc.name)}</div>
         </div>`
      : "";

    const resultMarkup = rankedResults
      .map(({ proc }, index) => {
        const isFavorited = !!wishlist[proc.id];
        const isChecked = !!cart[proc.id];

        const heartSvg = isFavorited
          ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#F198AE" stroke="#F198AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`
          : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#F68F9D]/70 hover:text-[#F68F9D]"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;

        const checkSvg = isChecked
          ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F198AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`
          : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 hover:text-[#F68F9D]"><path d="M12 5v14M5 12h14"/></svg>`;

        return `
          <div class="search-result-item flex items-center gap-2 p-3 text-xs border-b border-gray-100 hover:bg-[#F7E4E8] transition"
               data-search-index="${index}"
               onmouseenter="setSearchActiveIndex(${index}, false)"
               onclick="selectSearchResult('${proc.category}', '${proc.id}')">
            <button class="shrink-0" onclick="event.stopPropagation(); toggleWishlist('${proc.id}'); renderSearchResults();">
              ${heartSvg}
            </button>
            <button class="shrink-0" onclick="event.stopPropagation(); toggleCartFromSearch('${proc.id}'); renderSearchResults();">
              ${checkSvg}
            </button>
            <div class="flex-1 min-w-0">
              <div class="font-medium text-gray-800 truncate">${escapeHtml(proc.name)}</div>
            </div>
            <div class="text-right text-[#F68F9D] whitespace-nowrap">${formatPrice(proc.price)}원</div>
          </div>
        `;
      })
      .join("");

    searchResultsDropdown.innerHTML = `${suggestionMarkup}${resultMarkup}`;
    searchResultsDropdown.classList.remove("hidden");

    searchVisibleIds = rankedResults.map(({ proc }) => proc.id);

    // 재렌더 전에 하이라이트돼 있던 항목을 새 목록에서 다시 찾는다
    if (previousActiveId) {
      const restoredIndex = searchVisibleIds.indexOf(previousActiveId);
      searchActiveIndex = restoredIndex;
    } else if (searchActiveIndex >= searchVisibleIds.length) {
      searchActiveIndex = -1;
    }

    applySearchHighlight(false);
  }

  // 현재 searchActiveIndex 에 맞춰 하이라이트 클래스를 다시 칠한다
  function applySearchHighlight(shouldScroll = true) {
    const items = searchResultsDropdown.querySelectorAll(".search-result-item");
    items.forEach((item, index) => {
      const isActive = index === searchActiveIndex;
      item.classList.toggle("search-result-active", isActive);
      if (isActive && shouldScroll) {
        item.scrollIntoView({ block: "nearest" });
      }
    });
  }

  function setSearchActiveIndex(index, shouldScroll = true) {
    if (!searchVisibleIds.length) {
      searchActiveIndex = -1;
      return;
    }
    const total = searchVisibleIds.length;
    searchActiveIndex = ((index % total) + total) % total;
    applySearchHighlight(shouldScroll);
  }

  function moveSearchActiveIndex(step) {
    if (!searchVisibleIds.length) return;
    if (searchActiveIndex < 0) {
      // 하이라이트가 없으면 아래로는 첫 항목, 위로는 마지막 항목부터
      setSearchActiveIndex(step > 0 ? 0 : searchVisibleIds.length - 1);
      return;
    }
    setSearchActiveIndex(searchActiveIndex + step);
  }

  function isSearchDropdownOpen() {
    return (
      searchResultsDropdown &&
      !searchResultsDropdown.classList.contains("hidden") &&
      searchVisibleIds.length > 0
    );
  }

  // 검색창: Tab → 첫 항목 하이라이트, ↑/↓ → 이동, Enter → 시술목록 토글
  function handleSearchKeydown(event) {
    // 한글 조합 중에는 브라우저 IME 가 Enter 를 먼저 쓰게 둔다
    if (event.isComposing || event.keyCode === 229) return;

    const key = event.key;

    if (key === "Tab") {
      if (!isSearchDropdownOpen()) return;
      event.preventDefault();
      if (searchActiveIndex < 0) {
        setSearchActiveIndex(0);
      } else {
        moveSearchActiveIndex(event.shiftKey ? -1 : 1);
      }
      return;
    }

    if (key === "ArrowDown" || key === "ArrowUp") {
      if (!isSearchDropdownOpen()) return;
      event.preventDefault();
      moveSearchActiveIndex(key === "ArrowDown" ? 1 : -1);
      return;
    }

    if (key === "Enter") {
      if (!isSearchDropdownOpen() || searchActiveIndex < 0) return;
      event.preventDefault();

      const procedureId = searchVisibleIds[searchActiveIndex];
      if (!procedureId) return;

      toggleCartFromSearch(procedureId);
      // 드롭다운을 닫지 않고 체크 상태만 갱신 → 연속으로 계속 추가 가능
      renderSearchResults();
      applySearchHighlight();
      searchInput.focus();
    }
  }

  function toggleCartFromSearch(procedureId) {
    const proc = allProceduresData.find((p) => p.id === procedureId);
    if (!proc) return;

    if (cart[procedureId]) {
      delete cart[procedureId];
    } else {
      cart[procedureId] = {
        id: proc.id,
        name: proc.name,
        name_en: proc.name_en,   
        name_jp: proc.name_jp,   
        name_cn: proc.name_cn,   
        price: proc.price,
        category: proc.category,
        quantity: 1,
        totalTaxIncludedPrice: calculateTotalTaxIncludedPrice(proc.price, 1),
        checked: true,
      };
    }

    updateCart();
    renderProcedureList();
  }

  function selectSearchResult(category, procedureId) {
    toggleSearchInput();

    const categoryElement = document.getElementById(`menu-${category}`);
    const categoryName = categoryElement
      ? categoryElement.textContent + " 시술 목록"
      : "검색 결과";

    setCategoryFilter(category, categoryName);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const target = document.querySelector(`.procedure-item[data-id="${procedureId}"]`);
        if (!target) return;

        target.scrollIntoView({
          behavior: "smooth",
          block: "center",
        });

        target.classList.add("search-hit");
        setTimeout(() => {
          target.classList.remove("search-hit");
        }, 900);
      });
    });
  }

  window.onload = async () => {
    await loadProceduresFromSheet(); 
    setCategoryFilter(currentCategory, currentCategoryName);
    updateCart();
  };

  function removeCartItem(procedureId) {
    if (!cart[procedureId]) return;
    delete cart[procedureId];
    updateCart();
    renderProcedureList(); 
  }

  function clearCart() {
    cart = {};
    updateCart();
    renderProcedureList();

    const membershipInput = document.getElementById('membership-amount');
    if (membershipInput) membershipInput.value = '0';
    updateMembershipBalance();
  }
  window.clearCart = clearCart;

  window.formatPrice = function (value) {
    const num = parseInt(String(value || '').replace(/[^\d]/g, ''), 10) || 0;
    return num.toLocaleString('ko-KR');
  };

  window.handleMembershipInput = function () {
    const input = document.getElementById('membership-amount');
    if (!input) return;

    const digits = String(input.value || '').replace(/\D/g, '').slice(0, 8);
    input.value = digits ? Number(digits).toLocaleString('ko-KR') : '0';

    window.updateMembershipBalance();
  };

  window.updateMembershipBalance = function () {
    const membershipEl = document.getElementById('membership-amount');
    const finalTotalEl = document.getElementById('final-total');
    const outFinalEl = document.getElementById('membership-final');
    const outBalEl = document.getElementById('membership-balance');
    if (!membershipEl || !finalTotalEl || !outFinalEl || !outBalEl) return;

    const membership = Number(String(membershipEl.value || '').replace(/\D/g, '')) || 0;
    const finalTotal = Number(String(finalTotalEl.textContent || '').replace(/\D/g, '')) || 0;

    outFinalEl.textContent = finalTotal.toLocaleString('ko-KR');
    outBalEl.textContent = (membership - finalTotal).toLocaleString('ko-KR');
  };

  function formatMembershipInput() {
    const input = document.getElementById('membership-amount');
    if (!input) return;

    const digits = input.value.replace(/\D/g, '');
    const num = Number(digits) || 0;

    input.value = num.toLocaleString('ko-KR');
  }

  function handleMembershipEnter(e) {
    if (e.key !== 'Enter') return;

    e.preventDefault();
    updateMembershipBalance();
  }

  const membershipOptions = [
    { id: 'vip1000', label: 'VIP1000+300', checked: false },
    { id: 'vip600',  label: 'VIP600+150',  checked: false },
    { id: 'vip500',  label: 'VIP500+125',  checked: false },
    { id: 'vip400',  label: 'VIP400+80',   checked: false },
    { id: 'vip300',  label: 'VIP300+60',   checked: false },
    { id: 'vip200',  label: 'VIP200+30',   checked: false },
    { id: 'vip100',  label: 'VIP100+10',   checked: false },
    { id: 'petit50', label: '쁘띠50+10',   checked: false },
    { id: 'petit20', label: '쁘띠20+3',    checked: false },
  ];

  function ensureMembershipPopup() {
    if (document.getElementById('membership-popup')) return;

    const popup = document.createElement('div');
    popup.id = 'membership-popup';
    popup.className = `hidden fixed z-50 bg-white border border-gray-200 rounded-lg shadow-xl p-3 text-[12px] w-[260px]`.trim();

    popup.innerHTML = `

  function renderMembershipPopupList() {

  function handleMembershipOptionToggle(id, checked) {

  function positionMembershipPopup() {
    const btn = document.getElementById('btn-membership-plus');
    const popup = document.getElementById('membership-popup');
    if (!btn || !popup) return;

    const r = btn.getBoundingClientRect();
    const gap = 8;

    let left = r.right + gap;
    let top = r.top - 6;

    const popupW = 260;
    if (left + popupW > window.innerWidth - 8) {
      left = r.left - popupW - gap;
    }

    const popupH = 220; 
    if (top + popupH > window.innerHeight - 8) {
      top = window.innerHeight - popupH - 8;
    }
    if (top < 8) top = 8;

    popup.style.left = `${Math.max(8, left)}px`;
    popup.style.top = `${top}px`;
  }

  function openMembershipPopup() {
    ensureMembershipPopup();
    renderMembershipPopupList();

    const popup = document.getElementById('membership-popup');
    popup.classList.remove('hidden');
    positionMembershipPopup();
  }

  function closeMembershipPopup() {
    const popup = document.getElementById('membership-popup');
    if (!popup) return;
    popup.classList.add('hidden');
  }

  function toggleMembershipPopup(event) {
    event.stopPropagation();
    ensureMembershipPopup();

    const popup = document.getElementById('membership-popup');
    const isOpen = !popup.classList.contains('hidden');

    if (isOpen) closeMembershipPopup();
    else openMembershipPopup();
  }

  document.addEventListener('click', (e) => {
    const popup = document.getElementById('membership-popup');
    const btn = document.getElementById('btn-membership-plus');
    if (!popup || popup.classList.contains('hidden')) return;

    if (popup.contains(e.target) || (btn && btn.contains(e.target))) return;
    closeMembershipPopup();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMembershipPopup();
  });

  window.addEventListener('resize', () => {
    const popup = document.getElementById('membership-popup');
    if (!popup || popup.classList.contains('hidden')) return;
    positionMembershipPopup();
  });

  function exportChartOnly() {
    try {
      const items = Object.values(cart || {})
        .filter(it => it && it.checked)                 
        .sort(sortForChart);

      if (items.length === 0) {
        alert('선택된 시술이 없습니다.');
        return;
      }

      let total = 0;

      const lines = items.map(item => {
        const rawName = String(item.name || '').trim();
        const price = Number(item.totalTaxIncludedPrice || 0);
        total += price;

        let name = rawName.replace(/(\d+)\s*회/g, (_, n) => `${n}-1`);

        if (!/(\d+)-1/.test(name)) {
          const qty = Number(item.quantity) || 1;
          name = `${name} ${qty}-1`;
        }

        name = name.replace(/\s*\+\s*/g, '+');
        name = name.replace(/([가-힣A-Za-z])(\d+-1)/g, '$1 $2');

        return `${name} ${price.toLocaleString('ko-KR')}원`;
      });

      lines.push(`총 ${total.toLocaleString('ko-KR')}원`);

      const textToCopy = lines.join('\n');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy)
          .catch(() => fallbackCopyText(textToCopy));
      } else {
        fallbackCopyText(textToCopy);
      }
    } catch (e) {
      alert('차트 생성 중 오류가 발생했습니다.');
      console.error(e);
    }
  }

  function fallbackCopyText(text) {
    const temp = document.createElement('textarea');
    temp.value = text;
    temp.style.position = 'fixed';
    temp.style.left = '-9999px';
    temp.style.top = '-9999px';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();

    try {
      document.execCommand('copy');
    } catch (e) {
      alert('복사 실패 — 수동 복사가 필요합니다.');
      console.error(e);
    }

    document.body.removeChild(temp);
  }

  function getTodayYYMMDD() {
    const d = new Date();
    const yy = String(d.getFullYear()).slice(-2);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yy}.${mm}.${dd}`;
  }

  function getSelectedMembershipType() {
    const el = document.querySelector('#membership-popup input[type="checkbox"]:checked');
    if (!el) return null;
    return String(el.value || '').trim();
  }

  function buildMembershipHeaderLines(type) {
    const today = getTodayYYMMDD();

    const map = {
      '쁘띠50+10': [`쁘띠50+10(은빈S/${today})`],
      '쁘띠20+3':  [`쁘띠20+3(은빈S/${today})`],
      'VIP100+10': [`VIP100+10(은빈S/${today})`, '회원권 피부관리 1회 서비스*KEEP'],
      'VIP200+30': [`VIP200+30(은빈S/${today})`, '회원권 레이저 1회 서비스*KEEP'],
      'VIP300+60': [`VIP300+60(은빈S/${today})`, '회원권 레이저 2회 서비스*KEEP'],
      'VIP400+80': [`VIP400+80(은빈S/${today})`, '회원권 레이저 4회 서비스*KEEP'],
      'VIP500+125': [`VIP500+125(은빈S/${today})`, '회원권 레이저 4회 서비스*KEEP'],
      'VIP600+150': [`VIP600+150(은빈S/${today})`, '회원권 레이저 5회 서비스*KEEP'],
      'VIP1000+300': [`VIP1000+300(은빈S/${today})`, '회원권 레이저 4회 서비스+부스터 서비스 *KEEP'],
    };

    const key = String(type).replace(/\s+/g, '').trim();
    return map[key] || [`${key}(은빈S/${today})`];

  function generateChartFromMembershipPopup() {
    try {
      const selectedType = getSelectedMembershipType();

        alert('회원권을 선택해주세요.');
        return;
      }

      const headerLines = buildMembershipHeaderLines(selectedType);

      const items = Object.values(cart || {})
        .filter(it => it && it.checked)
        .sort(sortForChart);

      if (items.length === 0) {
        alert('선택된 시술이 없습니다.');
        return;
      }

      let total = 0;

      const lines = items.map(item => {
        const rawName = String(item.name || '').trim();

  function openInfoModal(imgSrc) {
    document.getElementById('info-modal-img').src = imgSrc;
    document.getElementById('info-modal').classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }

  function closeInfoModal() {
    document.getElementById('info-modal').classList.add('hidden');
    document.getElementById('info-modal-img').src = '';
    document.body.classList.remove('overflow-hidden');
  }

  document.addEventListener("DOMContentLoaded", () => {
      const allBtn = document.getElementById("all-btn");
      const modal = document.getElementById("all-modal");
      const backdrop = document.getElementById("all-modal-backdrop");
      const content = document.getElementById("all-modal-content");

      function openAllModal() {
        modal.classList.remove("hidden");
        document.body.classList.add("overflow-hidden"); 
      }

      function closeAllModal() {
        modal.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
      }

      allBtn?.addEventListener("click", (e) => {
        e.preventDefault();
        openAllModal();
      });

      backdrop?.addEventListener("click", closeAllModal);
      content?.addEventListener("click", (e) => e.stopPropagation());

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !modal.classList.contains("hidden")) {
          closeAllModal();
        }
      });

  document.addEventListener("DOMContentLoaded", () => {
    const vipBtn = document.getElementById("vip-btn");
    const vipImages = document.getElementById("vip-images");
    const procedureArea = document.getElementById("procedure-area");
    const leftPanel = vipImages?.closest("section");

    vipBtn?.addEventListener("click", (e) => {
      e.preventDefault();
      if (!vipImages || !procedureArea) return;

      const openingVip = vipImages.classList.contains("hidden");

      if (openingVip) {
        procedureArea.classList.add("hidden");
        vipImages.classList.remove("hidden");
        leftPanel?.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        vipImages.classList.add("hidden");
        procedureArea.classList.remove("hidden");
        leftPanel?.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  });

  (() => {
    const track = document.getElementById("all-slider-track");
    const prev = document.getElementById("all-prev");
    const next = document.getElementById("all-next");
    const allBtn = document.getElementById("all-btn");

    if (!track || !prev || !next || !allBtn) return;

    const slides = track.children;
    const total = slides.length;
    let index = 0;

    function update() {
      track.style.transform = `translateX(${-index * 100}%)`;
    }

    prev.addEventListener("click", (e) => {
      e.stopPropagation();
      index = (index - 1 + total) % total;
      update();
    });

    next.addEventListener("click", (e) => {
      e.stopPropagation();
      index = (index + 1) % total;
      update();
    });

    allBtn.addEventListener("click", () => {
      index = 0;
      update();
    });
  })();

    if (e.key !== "Escape") return;

    const vipImages = document.getElementById("vip-images");
    const procedureArea = document.getElementById("procedure-area");

    if (!vipImages) return;

    if (!vipImages.classList.contains("hidden")) {
      vipImages.classList.add("hidden");
      if (procedureArea) {
        procedureArea.classList.remove("hidden");
      }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;

    const dropdown = document.getElementById("search-results-dropdown");
    const searchContainer = document.getElementById("search-container");
    const searchInput = document.getElementById("search-input");

    if (dropdown && !dropdown.classList.contains("hidden")) {
      dropdown.classList.add("hidden");
      dropdown.innerHTML = ""; 
    }

    if (searchContainer && searchContainer.style.width !== "0px") {
      searchContainer.style.width = "0px";
      searchContainer.style.opacity = "0";
    }

    if (searchInput) {
      searchInput.blur();
    }
  });

  window.parseKrwNumber = function(text) {
    if (text == null) return 0;
    return Number(String(text).replace(/[^\d]/g, "")) || 0;
  }

  function formatKrw(n) {
    return Math.round(n).toLocaleString("ko-KR") + "원";
  }

  function toggleDiscountText() {
    const box = document.getElementById('discount-text');
    const finalEl = document.getElementById('final-total');
    if (!box || !finalEl) return;

    if (!box.classList.contains('hidden')) {
      box.classList.add('hidden');
      return;
    }

    const base = parseKrwNumber(finalEl.textContent);

    const discounts = [
      { label: '2인동반 5%', val: base * 0.95 },
      { label: '3인동반 10%', val: base * 0.90 },
      { label: '지인할인 5%', val: base * 0.95 },
    ];

    box.innerHTML = '';

    discounts.forEach(item => {
      const fullText = `→ ${item.label} ${formatKrw(item.val)}`;

      const row = document.createElement('div');
      row.className = 'flex items-center justify-between mb-1';

      const txt = document.createElement('span');
      txt.textContent = fullText;

      const cpBtn = document.createElement('button');
      cpBtn.type = 'button';
      cpBtn.textContent = 'copy';
      cpBtn.className = 'ml-2 px-1 text-[9px] text-gray-400 border border-gray-200 rounded h-[14px] leading-none hover:text-[#F6B7C6]';

      cpBtn.onclick = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(fullText)
            .catch(() => fallbackCopyText(fullText));
        } else {
          fallbackCopyText(fullText);
        }
      };

      row.appendChild(txt);
      row.appendChild(cpBtn);
      box.appendChild(row);
    });

    box.classList.remove('hidden');
  }

  // ==========================================================
  // [실시간 환율 변환 화이트 미니멀 캡슐 툴팁 핵심 로직 구역]
  // ==========================================================
  let exchangeRates = { USD: 1350, CNY: 185, JPY: 900 };

  async function fetchExchangeRates() {
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/KRW');
      if (res.ok) {
        const data = await res.json();
        exchangeRates.USD = Math.round(1 / data.rates.USD);
        exchangeRates.CNY = Math.round(1 / data.rates.CNY);
        exchangeRates.JPY = Math.round((1 / data.rates.JPY) * 100);
        console.log("실시간 환율 갱신 성공:", exchangeRates);
      }
    } catch (e) {
      console.warn("실시간 환율 로드 실패, 기본값으로 연동합니다.");
    }
  }
  window.addEventListener('DOMContentLoaded', fetchExchangeRates);

  window.showCurrencyTooltip = function(e, krwAmount) {
    const tooltip = document.getElementById('currency-tooltip');
    if (!tooltip || !krwAmount || krwAmount <= 0) return;

    const usd = (krwAmount / exchangeRates.USD).toFixed(2);
    const cny = (krwAmount / exchangeRates.CNY).toFixed(1);
    const jpy = ((krwAmount / exchangeRates.JPY) * 100).toFixed(0);

    tooltip.innerHTML = `
      <span>🇺🇸 $${Number(usd).toLocaleString()}</span>
      <span class="text-gray-300">|</span>
      <span>🇨🇳 ¥${Number(cny).toLocaleString()}</span>
      <span class="text-gray-300">|</span>
      <span>🇯🇵 ¥${Number(jpy).toLocaleString()}</span>
    `;
    tooltip.classList.remove('hidden');
    moveCurrencyTooltip(e);
  }

  window.moveCurrencyTooltip = function(e) {
    const tooltip = document.getElementById('currency-tooltip');
    if (!tooltip) return;
    tooltip.style.left = (e.clientX - tooltip.offsetWidth - 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
  }

  window.hideCurrencyTooltip = function() {
    const tooltip = document.getElementById('currency-tooltip');
    if (tooltip) tooltip.classList.add('hidden');
  }
</script>
